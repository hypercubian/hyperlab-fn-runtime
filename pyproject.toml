[tool.poetry]
name = "hyperlab-fn-runtime"
version = "0.1.0"
description = "Shared drain runtime for hyperlab serverless functions (KEDA ScaledJob + NATS JetStream)"
authors = ["Babak Takand <takandb@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "hyperlab_fn_runtime", from = "src" }]
include = [{ path = "src/hyperlab_fn_runtime/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.11"
nats-py = "^2.9"
prometheus-client = ">=0.21"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = "*"
pytest-cov = "*"
black = "*"
isort = "*"
flake8 = "*"
flake8-bugbear = "*"
flake8-comprehensions = "*"
flake8-docstrings = "*"
mypy = "*"
bandit = "*"
pre-commit = ">=4.3"
detect-secrets = ">=1.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated tests of pure logic (no IO, no subprocess)",
    "integration: tests that exercise external boundaries",
    "functional: end-to-end scenarios through the public API",
    "e2e: full-stack scenarios against a running deployment",
    "slow: slow-running tests",
]
addopts = "--strict-markers"

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["src/hyperlab_fn_runtime"]
